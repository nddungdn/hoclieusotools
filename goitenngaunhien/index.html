<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#faf6f0">
    <meta name="description" content="Tiện ích gọi tên học sinh ngẫu nhiên bằng vòng quay, hỗ trợ tải danh sách từ TXT, CSV, Excel và Word.">
    <title>Gọi tên ngẫu nhiên | Học liệu số</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #faf6f0;
        }
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        button, input, textarea {
            font: inherit;
        }
#app-goi-ten-ngau-nhien * {
            box-sizing: border-box;
        }
        #gtnn-home-btn,
        #gtnn-fullscreen-btn {
            position: absolute;
            top: 5px;
            background: rgba(255,255,255,0.75);
            color: #4f39f6;
            border: 1px solid #4f39f6;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
            line-height: normal;
        }
        #gtnn-home-btn { left: 20px; }
        #gtnn-fullscreen-btn { right: 20px; }
        #gtnn-home-btn:hover,
        #gtnn-fullscreen-btn:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }
        #gtnn-title {
            color: #4f39f6; /* Màu vàng */
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #gtnn-main-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 42px;
            width: 100%;
            max-width: 1200px;
            flex: 1 0 auto;
        }
        
        /* Chỉnh CSS khi ở chế độ Fullscreen */
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-title,
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-input-section,
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-footer,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-title,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-input-section,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-footer {
            display: none !important; 
        }
        #app-goi-ten-ngau-nhien:fullscreen, 
        #app-goi-ten-ngau-nhien:-webkit-full-screen {
            justify-content: center; 
            background: #003366; 
            padding: 0;
        }
        
        /* Cấu hình Fullscreen: Khung quay chiếm trọn màn hình */
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-wheel-section,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-wheel-section {
            transform: none; 
            width: 100vw;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-goi-ten-ngau-nhien:fullscreen #gtnn-canvas-container,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-canvas-container {
            width: 90vmin; /* Phóng to tối đa theo màn hình */
            height: 90vmin;
        }

        /* Fullscreen: Mũi tên to lên tương ứng */
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-pointer,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-pointer {
            border-top: 4vmin solid transparent;
            border-bottom: 4vmin solid transparent;
            border-right: 8vmin solid #ff0000;
            right: -8vmin;
        }

        #gtnn-wheel-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            transition: transform 0.3s ease;
            flex: 0 0 auto;
        }
        #gtnn-canvas-container {
            position: relative;
            width: min(42vw, 450px);
            height: min(42vw, 450px);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #fff;
            border: none; 
        }
        #gtnn-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }
        #gtnn-pointer {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-right: 50px solid #ff0000;
            z-index: 10;
            filter: drop-shadow(-2px 2px 2px rgba(0,0,0,0.4));
        }
        #gtnn-center-spin {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid rgba(0,0,0,0.16);
            background: #ffffff;
            box-shadow: 0 3px 9px rgba(0,0,0,0.30), inset 0 0 0 5px #f3f3f3;
            cursor: pointer;
            z-index: 30;
            padding: 0;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s;
            touch-action: manipulation;
        }
        #gtnn-center-spin:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 5px 12px rgba(0,0,0,0.35), inset 0 0 0 5px #f3f3f3;
        }
        #gtnn-center-spin:active {
            transform: translate(-50%, -50%) scale(0.96);
        }
        #gtnn-center-spin.disabled,
        #gtnn-center-spin:disabled {
            cursor: not-allowed;
            opacity: 0.72;
            transform: translate(-50%, -50%);
        }
        #app-goi-ten-ngau-nhien:fullscreen #gtnn-center-spin,
        #app-goi-ten-ngau-nhien:-webkit-full-screen #gtnn-center-spin {
            width: clamp(60px, 8vmin, 88px);
            height: clamp(60px, 8vmin, 88px);
            border-width: clamp(4px, 0.5vmin, 6px);
        }

        #gtnn-input-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        #gtnn-input-section h3 {
            margin: 0;
            color: #003366;
            text-align: center;
        }
        #gtnn-upload-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s, transform 0.2s;
        }
        #gtnn-upload-btn:hover { background: #1976d2; transform: scale(1.02); }
        #gtnn-namelist {
            width: 100%;
            height: 120px; 
            resize: none;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        #gtnn-update-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #gtnn-update-btn:hover { background: #43a047; transform: scale(1.02); }

        #gtnn-file-hint {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: -4px;
        }
        #gtnn-footer {
            width: 100%;
            text-align: center;
            margin-top: 18px;
            padding: 10px 12px 0;
            color: #666;
            font-size: 13px;
        }
        #gtnn-footer a {
            color: #4f39f6;
            font-weight: 700;
            text-decoration: none;
        }
        #gtnn-footer a:hover { text-decoration: underline; }

        #gtnn-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #gtnn-modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: gtnn-popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border: 5px solid #ff007f;
        }
        @keyframes gtnn-popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #gtnn-winner-name {
            font-size: 3rem;
            color: #e91e63;
            margin: 10px 0;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
            word-wrap: break-word;
        }
        #gtnn-fun-action {
            font-size: 1.5rem;
            color: #3f51b5;
            margin: 20px 0;
            padding: 15px;
            background: #e8eaf6;
            border-radius: 10px;
            font-weight: bold;
        }
        #gtnn-close-modal {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        #gtnn-close-modal:hover { background: #1976d2; }

        @media (max-width: 768px) {
            #app-goi-ten-ngau-nhien { padding: 48px 14px 16px !important; overflow-y: auto !important; }
            #gtnn-home-btn, #gtnn-fullscreen-btn {
                top: 8px;
                padding: 7px 10px;
                font-size: 12px;
            }
            #gtnn-home-btn { left: 10px; }
            #gtnn-fullscreen-btn { right: 10px; }
            #gtnn-title { font-size: 2rem; margin-top: 4px; }
            #gtnn-main-container {
                flex-direction: column;
                gap: 32px;
                flex: 0 0 auto;
            }
            #gtnn-canvas-container { width: 300px; height: 300px; }
            #gtnn-pointer { border-right-width: 35px; border-top-width: 15px; border-bottom-width: 15px; right: -20px; }
            #gtnn-center-spin { width: 54px; height: 54px; border-width: 3px; }
            #gtnn-input-section { max-width: 500px; min-width: 0; }
            #gtnn-winner-name { font-size: 2.2rem; }
            #gtnn-footer { margin-top: 12px; }
        }

        @media (max-width: 360px) {
            #gtnn-canvas-container { width: 270px; height: 270px; }
            #gtnn-title { font-size: 1.65rem; }
        }
    </style>
</head>
<body>
<div id="app-goi-ten-ngau-nhien" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #faf6f0; min-height: 100vh; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative; width: 100%;">

    <a id="gtnn-home-btn" href="https://www.hoclieuso.id.vn/" target="_top" rel="noopener" title="Về trang chủ Học liệu số">⌂ Trang chủ</a>
    <button id="gtnn-fullscreen-btn" onclick="toggleFullScreen()" title="Phóng to toàn màn hình">⛶ Toàn màn hình</button>
<h1 id="gtnn-title">GỌI TÊN NGẪU NHIÊN</h1>

    <div id="gtnn-main-container">
        
        <div id="gtnn-wheel-section">
            <div id="gtnn-canvas-container">
                <canvas id="gtnn-canvas" width="600" height="600"></canvas>
                <div id="gtnn-pointer"></div>
                <button id="gtnn-center-spin" type="button" onclick="spin()" title="Nhấn để quay" aria-label="Nhấn nút giữa để quay vòng quay"></button>
            </div>
        </div>

        <div id="gtnn-input-section">
            <h3>TẢI LÊN DANH SÁCH</h3>
            
            <input type="file" id="gtnn-file-upload" accept=".txt,.csv,.xlsx,.xls,.docx" style="display: none;" onchange="handleFileUpload(event)">
            <button id="gtnn-upload-btn" onclick="document.getElementById('gtnn-file-upload').click()">📂 Chọn file danh sách</button>
            <div id="gtnn-file-hint">Hỗ trợ TXT, CSV, Excel (.xlsx/.xls) và Word (.docx)</div>

            <textarea id="gtnn-namelist" placeholder="Nhập tên học sinh vào đây...&#10;Ví dụ:&#10;Nguyễn Văn A&#10;Trần Thị B&#10;Lê Văn C"></textarea>
            
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 5px; margin-bottom: 5px;">
                <label for="gtnn-spin-time" style="font-weight: bold; color: #d81b60; font-size: 14px;">⏳ Thời gian quay (giây):</label>
                <input type="number" id="gtnn-spin-time" value="6" min="1" max="60" style="width: 70px; padding: 8px; border-radius: 5px; border: 2px solid #ccc; font-size: 16px; font-weight: bold; text-align: center; color: #333;">
            </div>

            <button id="gtnn-update-btn" onclick="updateWheel()">CẬP NHẬT VÒNG QUAY</button>
        </div>

    </div>

    <div id="gtnn-footer">Tiện ích được phát triển bởi <a href="https://www.hoclieuso.id.vn/" target="_blank" rel="noopener noreferrer">Học liệu số</a></div>

    <div id="gtnn-modal">
        <div id="gtnn-modal-content">
            <h2 style="color:#ff9800; margin-top:0;">🎉 CHÚC MỪNG 🎉</h2>
            <div id="gtnn-winner-name">Tên Học Sinh</div>
            <div id="gtnn-fun-action">Phần thưởng/Hình phạt hiển thị ở đây</div>
            <button id="gtnn-close-modal" onclick="closeModal()">Tiếp Tục</button>
        </div>
    </div>
</div>

<script>
// Xử lý chế độ Fullscreen
        function toggleFullScreen() {
            const elem = document.getElementById("app-goi-ten-ngau-nhien");
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }

        // Lắng nghe sự kiện thay đổi màn hình để đổi tên nút
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        function updateFullscreenButton() {
            const btn = document.getElementById('gtnn-fullscreen-btn');
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                btn.innerHTML = '🗗 Thu nhỏ';
            } else {
                btn.innerHTML = '⛶ Toàn màn hình';
            }
        }

        const colors = [
            '#FF3B30', '#FF9500', '#FFCC00', '#4CD964', 
            '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55',
            '#E57373', '#F06292', '#BA68C8', '#9575CD',
            '#7986CB', '#64B5F6', '#4FC3F7', '#4DD0E1',
            '#4DB6AC', '#81C784', '#AED581', '#DCE775'
        ];

        const funActions = [
            "🎁 Trả lời đúng được cộng 1 điểm KTTX!",
            "🎤 Hát một bài ngắn cho cả lớp nghe.",
            "🤝 Em được quyền nhờ trợ giúp của bạn thân.",
            "🍀 May mắn quá! Được bỏ qua câu này.",
            "🤪 Làm một mặt cười thật xấu xí.",
            "👏 Cả lớp vỗ tay tuyên dương!",
            "🏃 Em có thể đứng một chân để trả lời.",
            "🍬 Được tặng 1 viên kẹo (nếu thầy cô có).",
            "👑 Em được chọn câu hỏi khác (nếu muốn).",
            "💡 Em có thể 'đá' câu hỏi cho bạn khác."
        ];

        function cleanImportedName(value) {
            let text = String(value ?? '').replace(/\u00a0/g, ' ').trim();
            text = text.replace(/^['"]+|['"]+$/g, '').trim();
            text = text.replace(/^\s*(?:\d+|[A-Za-z])\s*[.):-]\s*/, '');
            return text.replace(/\s+/g, ' ').trim();
        }

        function normalizeForMatch(value) {
            return cleanImportedName(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function isHeaderCell(value) {
            const text = normalizeForMatch(value);
            return /^(stt|so thu tu|ho va ten|ho ten|ten hoc sinh|hoc sinh|student name|name)$/.test(text);
        }

        function isLikelyName(value) {
            const text = cleanImportedName(value);
            if (!text || isHeaderCell(text) || /^\d+(?:[.,]\d+)?$/.test(text)) return false;
            return /[A-Za-zÀ-ỹ]/.test(text);
        }

        function extractNamesFromRows(rows) {
            const normalizedRows = rows
                .map(row => Array.isArray(row) ? row : [row])
                .map(row => row.map(cleanImportedName));

            let nameColumn = -1;
            let headerRow = -1;
            for (let r = 0; r < Math.min(normalizedRows.length, 12) && nameColumn === -1; r++) {
                for (let c = 0; c < normalizedRows[r].length; c++) {
                    const cell = normalizeForMatch(normalizedRows[r][c]);
                    if (/^(ho va ten|ho ten|ten hoc sinh|hoc sinh|student name|name)$/.test(cell)) {
                        nameColumn = c;
                        headerRow = r;
                        break;
                    }
                }
            }

            if (nameColumn === -1) {
                const maxColumns = normalizedRows.reduce((max, row) => Math.max(max, row.length), 0);
                let bestScore = -Infinity;
                for (let c = 0; c < maxColumns; c++) {
                    let score = 0;
                    normalizedRows.slice(0, 80).forEach(row => {
                        const value = row[c] || '';
                        if (isLikelyName(value)) {
                            score += value.includes(' ') ? 3 : 1;
                            if (value.length >= 5 && value.length <= 50) score += 1;
                        } else if (/^\d+(?:[.,]\d+)?$/.test(value)) {
                            score -= 2;
                        }
                    });
                    if (score > bestScore) {
                        bestScore = score;
                        nameColumn = c;
                    }
                }
            }

            const namesFromRows = normalizedRows
                .slice(headerRow >= 0 ? headerRow + 1 : 0)
                .map(row => cleanImportedName(row[nameColumn] || ''))
                .filter(isLikelyName);

            return namesFromRows;
        }

        function extractNamesFromText(text) {
            let lines = text
                .split(/\r?\n|\t/)
                .map(cleanImportedName)
                .filter(isLikelyName);
            return lines;
        }

        function applyImportedNames(importedNames) {
            if (importedNames.length < 2) {
                alert('Không tìm thấy đủ tên học sinh trong file. Vui lòng kiểm tra lại nội dung file.');
                return;
            }
            document.getElementById('gtnn-namelist').value = importedNames.join('\n');
            updateWheel();
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const extension = (file.name.split('.').pop() || '').toLowerCase();
            try {
                if (extension === 'txt') {
                    applyImportedNames(extractNamesFromText(await file.text()));
                } else if (extension === 'csv' || extension === 'xlsx' || extension === 'xls') {
                    if (typeof XLSX === 'undefined') {
                        throw new Error('Thư viện đọc Excel chưa tải được. Hãy kiểm tra kết nối Internet.');
                    }
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '', raw: false });
                    applyImportedNames(extractNamesFromRows(rows));
                } else if (extension === 'docx') {
                    if (typeof mammoth === 'undefined') {
                        throw new Error('Thư viện đọc Word chưa tải được. Hãy kiểm tra kết nối Internet.');
                    }
                    const data = await file.arrayBuffer();
                    const result = await mammoth.convertToHtml({ arrayBuffer: data });
                    const doc = new DOMParser().parseFromString(result.value || '', 'text/html');
                    const tableRows = Array.from(doc.querySelectorAll('table tr')).map(tr =>
                        Array.from(tr.querySelectorAll('th, td')).map(cell => cell.textContent || '')
                    );

                    let importedNames = [];
                    if (tableRows.length > 0) {
                        importedNames = extractNamesFromRows(tableRows);
                    }

                    if (importedNames.length < 2) {
                        const blocks = Array.from(doc.querySelectorAll('p, li'))
                            .map(node => node.textContent || '')
                            .join('\n');
                        importedNames = extractNamesFromText(blocks);
                    }
                    applyImportedNames(importedNames);
                } else {
                    alert('Định dạng chưa được hỗ trợ. Vui lòng dùng TXT, CSV, Excel (.xlsx/.xls) hoặc Word (.docx).');
                }
            } catch (error) {
                console.error(error);
                alert('Không thể đọc file: ' + (error.message || 'Lỗi không xác định'));
            } finally {
                event.target.value = '';
            }
        }

        let names = ["Hoàng Anh",
"Thiên Ân",
"Ngọc Diệp",
"Huyền Diệu",
"Hoàng Hải",
"Bảo Hân",
"Gia Hân",
"Quang Huy",
"Ngân Khánh",
"Đăng Khoa",
"Anh Khôi",
"Khánh Linh",
"Phương Mai",
"Ngọc Minh",
"Khánh Ngân",
"Bích Ngân",
"Bảo Nghi",
"Bảo Ngọc",
"Thảo Nguyên",
"Uyển Nhã",
"Khánh Nhật",
"Quỳnh Nhi",
"Quan Phong",
"Văn Phú",
"Xuân Phúc",
"Thanh Tâm",
"Hữu Thắng",
"Minh Thiên",
"Công Tín",
"Ngọc Vân"];
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let isSpinning = false;
        
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        const canvas = document.getElementById("gtnn-canvas");
        const ctx = canvas.getContext("2d");
        const centerSpinBtn = document.getElementById("gtnn-center-spin");

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const freqs = [440, 554.37, 659.25];
            freqs.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            });
        }

        function drawWheel() {
            arc = Math.PI / (names.length / 2);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            for (let i = 0; i < names.length; i++) {
                const angle = startAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, canvas.width / 2, angle, angle + arc, false);
                ctx.lineTo(0, 0);
                ctx.fill();

                ctx.lineWidth = 1;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "white";
                ctx.strokeStyle = "black";
                ctx.lineWidth = 3;
                
                // Tăng nhẹ kích thước font chữ
                let fontSize = 28;
                if(names.length > 20) fontSize = 18;
                else if(names.length > 15) fontSize = 22;
                
                ctx.font = `bold ${fontSize}px Arial`;
                
                // Đưa chữ ra sát viền hơn (0.95 thay vì 0.85)
                ctx.translate(Math.cos(angle + arc / 2) * (canvas.width / 2 * 0.95), 
                              Math.sin(angle + arc / 2) * (canvas.height / 2 * 0.95));
                ctx.rotate(angle + arc / 2);
                
                const text = names[i];
                ctx.textAlign = "right"; // Căn phải để đuôi chữ sát mép
                ctx.textBaseline = "middle";
                ctx.strokeText(text, 0, 0);
                ctx.fillText(text, 0, 0);
                ctx.restore();
            }

            // Vẽ vòng tròn tâm
            ctx.beginPath();
            ctx.fillStyle = "#fff";
            ctx.arc(0, 0, 30, 0, 2 * Math.PI, false);
            ctx.fill();
            
            ctx.beginPath();
            ctx.fillStyle = "#333";
            ctx.arc(0, 0, 23, 0, 2 * Math.PI, false);
            ctx.fill();
            
            ctx.beginPath();
            ctx.fillStyle = "#e0e0e0";
            ctx.arc(0, 0, 11, 0, 2 * Math.PI, false);
            ctx.fill();

            ctx.restore();
        }

        function updateWheel() {
            if(isSpinning) return;
            const textarea = document.getElementById('gtnn-namelist');
            const rawNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
            
            if (rawNames.length < 2) {
                alert("Vui lòng nhập ít nhất 2 tên để quay!");
                return;
            }
            
            names = rawNames;
            startAngle = 0;
            drawWheel();
        }

        let lastTickAngle = 0;

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            
            const currentArcAngle = startAngle % (Math.PI * 2);
            if (Math.abs(currentArcAngle - lastTickAngle) > arc) {
                playTickSound();
                lastTickAngle = currentArcAngle;
            }

            drawWheel();
            spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function spin() {
            if (isSpinning) return;
            
            initAudio(); 
            
            isSpinning = true;
            centerSpinBtn.classList.add('disabled');
            centerSpinBtn.disabled = true;
            
            let timeSeconds = parseFloat(document.getElementById('gtnn-spin-time').value);
            if (isNaN(timeSeconds) || timeSeconds <= 0) timeSeconds = 6; 
            
            spinAngleStart = Math.random() * 10 + 20; 
            spinTime = 0;
            spinTimeTotal = timeSeconds * 1000; 
            
            lastTickAngle = startAngle % (Math.PI * 2);
            rotateWheel();
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout);
            
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            
            let adjustedAngle = (360 - (startAngle * 180 / Math.PI) % 360) % 360;
            let index = Math.floor(adjustedAngle / arcd);
            
            const text = names[index];
            
            const randomAction = funActions[Math.floor(Math.random() * funActions.length)];

            setTimeout(() => {
                playWinSound();
                document.getElementById('gtnn-winner-name').innerText = text;
                document.getElementById('gtnn-fun-action').innerText = randomAction;
                document.getElementById('gtnn-modal').style.display = 'flex';
                
                isSpinning = false;
                centerSpinBtn.classList.remove('disabled');
                centerSpinBtn.disabled = false;
            }, 300); 
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function closeModal() {
            document.getElementById('gtnn-modal').style.display = 'none';
        }

        // Khởi tạo ban đầu
        document.getElementById('gtnn-namelist').value = names.join('\n');
        drawWheel();
</script>
</body>
</html>
